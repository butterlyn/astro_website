name: Ensure website release PR

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ensure-development-main-release-pr
  cancel-in-progress: false

jobs:
  ensure:
    if: github.repository == 'butterlyn/astro_website' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release-pr.mjs
            .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Create or reuse the release review
        run: node scripts/release-pr.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          # Missing configuration pauses creation during bootstrap.
          RELEASE_PR_AUTOMATION: ${{ vars.RELEASE_PR_AUTOMATION }}
