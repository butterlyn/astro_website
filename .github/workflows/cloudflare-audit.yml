name: Cloudflare topology audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'butterlyn/astro_website' && github.ref == 'refs/heads/development' && github.actor == 'butterlyn'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cloudflare-audit.mjs
            .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Inspect selected Worker, domain and Access configuration (GET only)
        run: node scripts/cloudflare-audit.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
