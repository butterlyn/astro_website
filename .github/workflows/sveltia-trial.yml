name: Sveltia trial

on:
  push:
    branches: [trial/sveltia]
  pull_request:
    branches: [trial/sveltia]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: sveltia-trial-${{ github.event.pull_request.number || 'published' }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  build:
    name: Sveltia build
    if: >-
      github.repository == 'butterlyn/astro_website' &&
      (github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'cms/sveltia_homepage/') ||
      startsWith(github.head_ref, 'cms/sveltia_pages/'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Report preview build
        run: node scripts/sveltia-ci.mjs status pending
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Import only the draft's Markdown and images into trusted site code
        run: node scripts/sveltia-ci.mjs prepare
      - name: Install pinned pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: pnpm exec wrangler deploy --config wrangler.sveltia.jsonc --dry-run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sveltia-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Report failed build
        if: failure()
        run: node scripts/sveltia-ci.mjs status failure
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: Sveltia preview deployment
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only this trial writes this Worker. Uploads and publishes share its queue.
    concurrency:
      group: cloudflare-leer-sveltia
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sveltia-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
      - id: guard
        name: Check trial target, artifact commit and current GitHub revision
        run: node scripts/sveltia-ci.mjs guard
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check the existing Cloudflare account
        if: steps.guard.outputs.current == 'true'
        run: pnpm preflight:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the official authenticator
        if: steps.guard.outputs.current == 'true' && github.event_name == 'push'
        run: pnpm exec wrangler deploy --config trial/sveltia-auth/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Supply OAuth credentials when the administrator has added them
        if: steps.guard.outputs.current == 'true' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_CLIENT_ID: ${{ secrets.SVELTIA_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.SVELTIA_GITHUB_CLIENT_SECRET }}
        run: |
          if [ -z "$GITHUB_CLIENT_ID" ] || [ -z "$GITHUB_CLIENT_SECRET" ]; then
            echo 'OAuth sign-in is pending administrator setup. See SVELTIA-TRIAL.md.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync(`${process.env.RUNNER_TEMP}/sveltia-auth-secrets.json`, JSON.stringify({GITHUB_CLIENT_ID: process.env.GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET: process.env.GITHUB_CLIENT_SECRET}), {mode: 0o600});'
          trap 'rm -f "$RUNNER_TEMP/sveltia-auth-secrets.json"' EXIT
          pnpm exec wrangler secret bulk "$RUNNER_TEMP/sveltia-auth-secrets.json" --config trial/sveltia-auth/wrangler.jsonc
      - id: preview
        name: Publish the trial branch or upload a draft preview version
        if: steps.guard.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
            pnpm exec wrangler versions upload --config wrangler.sveltia.jsonc --preview-alias "pr-$PR_NUMBER"
            echo "url=https://pr-$PR_NUMBER-leer-sveltia.butterlyn.workers.dev" >> "$GITHUB_OUTPUT"
          else
            pnpm exec wrangler deploy --config wrangler.sveltia.jsonc
            echo 'url=https://leer-sveltia.butterlyn.workers.dev' >> "$GITHUB_OUTPUT"
          fi
      - name: Check the deployed snapshot and expose its URL to Sveltia
        if: steps.guard.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SVELTIA_PREVIEW_URL: ${{ steps.preview.outputs.url }}
          CONTENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/sveltia-ci.mjs status success
          printf 'Trial preview: %s\n\nContent commit: `%s`\n' "$SVELTIA_PREVIEW_URL" "$CONTENT_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Report failed deployment
        if: failure()
        run: node scripts/sveltia-ci.mjs status failure
        env:
          GH_TOKEN: ${{ github.token }}
